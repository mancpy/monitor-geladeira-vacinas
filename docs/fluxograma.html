<g text-anchor="middle">
  <text x="500" y="42">Início (energização)</text>
  <text x="500" y="110">Configura GPIOs em nível baixo</text><text x="500" y="131">e o DS18B20 em 12 bits</text>
  <text x="500" y="197">Conecta ao Wi-Fi e ao broker MQTT</text><text x="500" y="218">(Last Will, status online, assina comando)</text>
  <text x="500" y="299">Broker</text><text x="500" y="318">conectado?</text>
  <text x="845" y="299" font-size="15">Tenta reconectar</text><text x="845" y="318" font-size="15">a cada 5 s</text>
  <text x="500" y="405">Processa mensagens MQTT recebidas</text>
  <text x="500" y="489">Chegou</text><text x="500" y="508">comando?</text>
  <text x="155" y="489" font-size="15">Aciona o atuador pedido</text><text x="155" y="508" font-size="15">e publica a confirmação</text>
  <text x="500" y="595">A cada 5 s: lê o DS18B20 (750 ms)</text>
  <text x="500" y="679">Leitura</text><text x="500" y="698">válida?</text>
  <text x="845" y="679" font-size="15">Descarta a leitura,</text><text x="845" y="698" font-size="15">mantém os atuadores</text>
  <text x="500" y="783">Aplica a regra: alarme NORMAL, ALTA</text><text x="500" y="804">ou BAIXA (histerese de 0,5 °C) e</text><text x="500" y="825">refrigeração (liga &gt; 8 °C, desliga em 6 °C)</text>
  <text x="500" y="901">Alarme</text><text x="500" y="920">mudou?</text>
  <text x="845" y="901" font-size="15">Publica o novo estado</text><text x="845" y="920" font-size="15">em alarme (retida)</text>
  <text x="500" y="1005">A cada 30 s: publica a temperatura</text><text x="500" y="1026">e repete o estado do alarme</text>
  <text x="500" y="1091">Atualiza relé, LED e buzzer; se algo</text><text x="500" y="1112">mudou, publica em atuadores</text>
